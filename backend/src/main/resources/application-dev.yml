spring:
  # File-backed H2 database so data survives backend restarts and reloads.
  datasource:
    url: jdbc:h2:file:./data/demo-db
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

logging:
  level:
    com.demo.backend: DEBUG
